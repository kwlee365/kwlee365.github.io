{%- comment -%}
A row of photos at one shared height, so mixed portrait and landscape shots
line up. Pass `images` (list of {src, alt}). Each opens full size in a new tab.
{%- endcomment -%}
<div class="gallery">
  {%- for im in include.images %}
  <a href="{{ im.src | relative_url }}" target="_blank" rel="noopener">
    <img src="{{ im.src | relative_url }}" alt="{{ im.alt }}" loading="lazy" decoding="async">
  </a>
  {%- endfor %}
</div>
