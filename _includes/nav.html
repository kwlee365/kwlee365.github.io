<nav class="nav">
  <div class="nav-container">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="Menu"><i class="fas fa-bars"></i></label>

    <ul class="nav-links">
      {%- for item in site.data.navigation.main -%}
        {%- assign target = item.url | relative_url -%}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if item.external %}target="_blank" rel="noopener"{% endif %}
             class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
        </li>
      {%- endfor -%}
    </ul>
  </div>
</nav>
