- title: >-
    Proprioceptive-Sensor-Based Whole-Body Walking Control and Real-Time Motion Planning
  title_ko: "내재 센서 기반 전신보행 제어 및 실시간 동작 계획"
  funder: "Ministry of Science and ICT (과학기술정보통신부)"
  when: "2022 – 2024"
  items:
