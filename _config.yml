# --- Site ---------------------------------------------------------------
title: Kwanwoo Lee
tagline: Humanoid robotics, whole-body control, and safe control
description: >-
  Kwanwoo Lee is an integrated M.S./Ph.D. student at Seoul National University
  working on humanoid locomotion, whole-body control, motion retargeting,
  and safety-critical control.
url: "https://kwlee365.github.io"
baseurl: ""
lang: en

# --- Profile (used by the sidebar) --------------------------------------
author:
  name: Kwanwoo Lee
  name_ko: 이관우
  avatar: /assets/images/kwlee.jpg
  meta:                        # plain lines under the name in the sidebar
    - Ph.D. Student in Robotics
    - Seoul National University
    - kwlee365 (at) snu.ac.kr
  cv: ""              # CV is not published in this repo; set a URL here to show the button
  email: kwlee365@snu.ac.kr
  github: kwlee365
  linkedin: kwanwoo-lee-16018821a
  scholar: ""          # add your Google Scholar profile URL when you have one
  youtube: ""          # add a channel URL if you want the icon shown

# --- Build --------------------------------------------------------------
theme: null            # no external theme; layouts live in _layouts/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /notes/:year/:month/:day/:title/
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - assets/CV_kwlee.pdf        # kept locally, never built or published
  - assets/images/kwlee.png    # 3 MB source image; the site uses the cropped kwlee.jpg
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
